<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>LoanTrack Pro</title>
<meta name="theme-color" content="#0b2a5b">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f5f7fa;--card:#fff;--tx:#14213d;--mu:#5b6678;--nv:#0b2a5b;--sky:#dcebfa;--ok:#1e8e3e;--wn:#b97800;--bd:#d93025;--ln:#e2e7ee}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#0f1624;--card:#18223a;--tx:#e8edf6;--mu:#9aa6bb;--nv:#6ea8ff;--sky:#22345a;--ok:#4cc36f;--wn:#f5b942;--bd:#ff7b72;--ln:#2a3654}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 "Plus Jakarta Sans",system-ui,-apple-system,Roboto,sans-serif;padding-bottom:76px}
header{background:var(--nv);color:#fff;padding:14px 16px;font-weight:700;display:flex;gap:8px;align-items:center}

main{padding:12px;max-width:640px;margin:auto}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid .card{margin:0}
.n{font-size:24px;font-weight:700;color:var(--nv)}.mu{color:var(--mu);font-size:13px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--ln);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}

nav button.on{color:var(--nv);font-weight:700}
input,select,textarea,button.b{width:100%;padding:12px;border:1px solid var(--ln);border-radius:10px;background:var(--card);color:var(--tx);font:inherit;margin:4px 0 8px}
button.b{background:var(--nv);color:#fff;border:0;font-weight:700;min-height:48px;cursor:pointer}
@media (prefers-color-scheme:dark){button.b{color:#0f1624}}
button.s{background:var(--sky);color:var(--nv)}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;background:var(--sky);color:var(--nv)}
.ok{color:var(--ok)}.wn{color:var(--wn)}.bd{color:var(--bd)}.err{color:var(--bd);font-size:13px;margin:-4px 0 6px}
.demo{background:var(--wn);color:#fff;border-radius:4px;padding:0 5px;font-size:11px;margin-left:4px}

.row{display:flex;justify-content:space-between;gap:8px}
.bar{height:10px;background:var(--sky);border-radius:5px;overflow:hidden;margin:3px 0 8px}.bar i{display:block;height:100%;background:var(--nv)}

.plus{display:inline-flex;width:46px;height:46px;border-radius:50%;background:#2f80ed;color:#fff;font-size:28px;align-items:center;justify-content:center;margin-top:-26px;box-shadow:0 4px 10px rgba(47,128,237,.4)}
h3.sec{margin:14px 0 6px;font-size:16px;color:var(--nv)}
.pri-High{background:#fde2e0;color:#c62828}.pri-Medium{background:#fdf0c9;color:#9a6a00}.pri-Low{background:#dcf5e3;color:#1e7a3a}
table{border-collapse:collapse;width:100%;white-space:nowrap}th,td{padding:4px 6px;border-bottom:1px solid var(--ln);text-align:right}th:first-child,td:first-child{text-align:left}
.em-top{background:linear-gradient(135deg,#0b2a5b,#16408a);border:1px solid rgba(212,175,55,.45);border-radius:20px;padding:18px;color:#fff;margin-bottom:12px}
.em-top h3{margin:2px 0;font:700 24px "Sora","Plus Jakarta Sans",system-ui,sans-serif;color:#fff}.em-k{font-size:10px;letter-spacing:.18em;color:#d4af37;font-weight:600}.em-s{font-size:12px;color:#c8d4ea}
.em-card{border-radius:18px;padding:14px}.em-l{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin:10px 0 0;font-weight:600}

.em-hero{background:radial-gradient(circle at 20% 0,#1d4f9f,#0a1f45 70%);border:1px solid rgba(212,175,55,.5);border-radius:22px;padding:20px;color:#fff;margin:12px 0;box-shadow:0 10px 28px rgba(11,42,91,.35)}
.em-big{font:700 36px "Sora","Plus Jakarta Sans",system-ui,sans-serif;color:#f3d77a;margin:4px 0}.em-ring{display:flex;align-items:center;gap:14px;margin-top:12px}
.em-leg{flex:1}.em-leg div{display:flex;flex-direction:column;font-size:12px;color:#c8d4ea;margin:6px 0}.em-leg b{color:#fff;font-size:15px}.em-leg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.em-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.em-grid div{background:var(--card);border:1px solid var(--ln);border-left:3px solid #d4af37;border-radius:12px;padding:10px}.em-grid span{display:block;font-size:11px;color:var(--mu)}.em-grid b{font-size:15px}
.em-h{font:600 15px "Sora","Plus Jakarta Sans",system-ui,sans-serif;color:var(--nv);cursor:pointer}.em-bars{display:flex;gap:6px;align-items:flex-end;overflow-x:auto;padding:8px 0}.em-bars>div{text-align:center;font-size:10px;color:var(--mu)}.em-col{display:flex;flex-direction:column;width:16px;justify-content:flex-end;height:92px}.em-col i{display:block}
.em-empty{background:var(--card);border:1px dashed var(--ln);border-radius:16px;padding:22px;text-align:center;color:var(--mu);margin-top:10px}
#splash{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at 50% 28%,#1d4f9f 0,#0b2a5b 45%,#050f24 100%);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 64px) 28px calc(env(safe-area-inset-bottom,0px) + 36px);color:#fff;text-align:center;transition:opacity .5s,transform .5s}

.sp-logo{width:116px;height:116px;border-radius:30px;background:linear-gradient(145deg,#12408a,#0a1f45);border:1.5px solid rgba(212,175,55,.7);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 10px rgba(212,175,55,.08),0 0 0 22px rgba(212,175,55,.04),0 18px 40px rgba(0,0,0,.45);animation:spUp .9s both,spFloat 4s ease-in-out 1s infinite}
.sp-logo rect{transform-box:fill-box;transform-origin:bottom;animation:spBar .8s both}.sp-logo rect:nth-child(2){animation-delay:.15s}.sp-logo rect:nth-child(3){animation-delay:.3s}
#splash h1{font:700 38px "Sora","Plus Jakarta Sans",system-ui,sans-serif;margin:30px 0 6px;letter-spacing:.3px;animation:spUp .9s .25s both}#splash h1 span{color:#f3d77a}
#splash .sp-line{width:56px;height:2px;background:linear-gradient(90deg,transparent,#d4af37,transparent);margin:10px 0;animation:spUp .9s .4s both}
#splash .sp-tag{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:#c8d4ea;animation:spUp .9s .5s both}
#splash .sp-bot{width:100%;max-width:360px;animation:spUp .9s .7s both}
#splash button{width:100%;border:0;border-radius:99px;padding:17px;font:700 17px "Plus Jakarta Sans",system-ui,sans-serif;letter-spacing:.04em;color:#0a1f45;background:linear-gradient(135deg,#f3d77a,#d4af37 60%,#b8912f);box-shadow:0 10px 26px rgba(212,175,55,.35);cursor:pointer}
#splash small{display:block;margin-top:14px;font-size:11px;color:#8ea1c4}
@keyframes spUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}@keyframes spFloat{50%{transform:translateY(-8px)}}@keyframes spBar{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){#splash *{animation:none!important}}
.hm-hero{background:radial-gradient(circle at 85% 0,#2a5fb8 0,#0b2a5b 50%,#06122b 100%);border:1px solid rgba(212,175,55,.5);border-radius:24px;padding:20px;color:#fff;margin-bottom:12px;box-shadow:0 12px 30px rgba(11,42,91,.35)}
.hm-date{font-size:12px;color:#c8d4ea;margin:4px 0 16px}.hm-lbl{font-size:12px;color:#c8d4ea}.hm-big{font:700 38px "Sora","Plus Jakarta Sans",system-ui,sans-serif;color:#f3d77a;margin:2px 0 12px}
.hm-chips{display:flex;gap:8px;flex-wrap:wrap}.hm-chips span{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:99px;padding:5px 11px;font-size:12px}.hm-chips .hm-red{background:rgba(235,87,87,.3);border-color:#eb5757}
.hm-qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.hm-qa button{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:12px 2px;color:var(--tx);font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:6px}.hm-qa span{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#0b2a5b,#16408a);display:flex;align-items:center;justify-content:center;font-size:18px;border:1px solid rgba(212,175,55,.5)}
.hm-kp{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -12px 12px;padding:2px 12px 6px}.hm-kp>div{flex:none;width:120px;scroll-snap-align:start;background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:12px;display:flex;flex-direction:column}.hm-kp span{font-size:18px}.hm-kp b{font:700 26px "Sora","Plus Jakarta Sans",system-ui,sans-serif;color:var(--nv);margin:4px 0 0}.hm-kp small{color:var(--mu);font-size:11px}
.hm-fn{display:flex;align-items:center;gap:8px;margin:9px 0;font-size:12px}.hm-fn>span{width:92px;color:var(--mu)}.hm-fn>div{flex:1;height:12px;background:var(--sky);border-radius:6px;overflow:hidden}.hm-fn>div i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#2f80ed,#d4af37)}.hm-fn>b{width:28px;text-align:right}
.hm-tl{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--ln)}.hm-tl>i{flex:none;width:10px;height:10px;border-radius:50%;background:#d4af37;margin-top:6px;box-shadow:0 0 0 4px rgba(212,175,55,.2)}
.cb{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:600;margin:2px 4px 2px 0;white-space:nowrap}
.cb-g{background:#d9f5e5;color:#13794a}.cb-a{background:#fdf0c9;color:#8a5d00}.cb-r{background:#fde2e0;color:#c62828}.cb-b{background:#dbe9ff;color:#1c4fb3}.cb-n{background:#e9edf3;color:#5b6678}
@media (prefers-color-scheme:dark){.cb-g{background:#12402a;color:#7ee2a8}.cb-a{background:#4a3a0d;color:#f5c75a}.cb-r{background:#4a1c19;color:#ff9a93}.cb-b{background:#17305e;color:#9ec2ff}.cb-n{background:#2a3654;color:#aab6cc}}
.cbr{margin-top:6px}.cu{border-left:3px solid #2f80ed}.cu-seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.cu-seg{grid-template-columns:repeat(4,1fr)}.cu-seg .b{padding:10px 2px;font-size:12px;min-height:44px}
button,input,select,textarea{font-family:inherit}
.bkb{background:rgba(255,255,255,.18);border:0;color:inherit;width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer}
h3,h4,.n,.em-h{letter-spacing:-.01em}

<script type="module" src="/src/backend.js"></script>

</head><body>
<div id="splash"><div class="sp-mid"><div class="sp-logo"><svg viewBox="0 0 64 64" width="68" height="68"><rect x="10" y="34" width="11" height="20" rx="3" fill="#5b8fd6"/><rect x="26" y="24" width="11" height="30" rx="3" fill="#8db4ec"/><rect x="42" y="14" width="11" height="40" rx="3" fill="#d4af37"/><path d="M9 26 L24 14 L33 19 L52 6" fill="none" stroke="#f3d77a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M43 6 H52 V15" fill="none" stroke="#f3d77a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div><h1>LoanTrack <span>Pro</span></h1><div class="sp-line"></div><div class="sp-tag">Loan management made simple</div></div><div class="sp-bot"><button onclick="var s=document.getElementById('splash');s.classList.add('out');setTimeout(function(){s.remove()},500)">Let’s Start →</button><small>Independent loan workflow tool</small></div></div>
<header><span id="bk"></span><b style="font-size:18px">◆ LoanTrack <span style="color:#9cc7ff">Pro</span></b><span id="bell" style="margin-left:auto"></span><span class="av" style="background:#3b82f6;color:#fff">U</span><span id="who" style="font-weight:400;font-size:12px"></span></header>
<main id="app"><p class="mu">Loading…</p></main>
<nav id="nav"></nav>
<script>
const ST=["New Lead","Contacted","Application In Progress","Application Submitted","Documents Pending","Documents Complete","Verification In Progress","Under Review","Approved","Rejected","On Hold","Disbursement In Progress","Disbursed","Closed"];
const LT=["Personal Loan","Home Loan","Business Loan","Vehicle Loan","Loan Against Property","Other"];
const SRC=["Walk-in","Referral","Phone Enquiry","Existing Customer","Other"];
const NOTE="Internal tracking status — not an official lender decision unless verified through an authorized source.";
let sess=null,staff=[],isOwner=false,canAll=false,rawC=[],rawT=[],FV={},draft=[],ei=null,skipCap=false,pinRes=[],arm=null,resch=null,db=null,me=null,isAdmin=false,tab="home",clients=[],tasks=[],sel=null,q="",fs="",errs={},toast="";
const $=s=>document.querySelector(s);
const ICN={home:"⌂",clients:"👥",add:'<span class="plus">+</span>',fu:"📅",calc:"🧮",cust:"🚗",me:"👤"};
const TI={Call:"📞",Meeting:"💬",Email:"✉️",Other:"📌"};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const mask=m=>m?String(m).replace(/\d(?=\d{2})/g,"•"):"—";
const money=n=>"₹"+Number(n).toLocaleString("en-IN");
const col=s=>["Approved","Disbursed","Closed"].includes(s)?"ok":s=="Rejected"?"bd":"wn";
async function init(){
  try{const u=await claude.use("user");db=await claude.use("db");
    if(u){isOwner=u.isOwner();}
  }catch(e){}
  if(!db){$("#app").innerHTML='<div class="card">Sign in to claude.ai to use LoanTrack Pro. Data is stored in the app database.</div>';return}
  watchCalcs();watchStaff();watchCust();
  db.collection("clients").onSnapshot(s=>{clients=s.docs.map(d=>({id:d.id,...d.data()}));clients.filter(c=>c.demo).forEach(c=>db.collection("clients").doc(c.id).delete().catch(()=>{}));rawC=clients.filter(c=>!c.demo);render()},e=>{toast=e.message;render()});
  db.collection("tasks").onSnapshot(s=>{tasks=s.docs.map(d=>({id:d.id,...d.data()}));tasks.filter(t=>String(t.cid).startsWith("DEMO")).forEach(t=>db.collection("tasks").doc(t.id).delete().catch(()=>{}));rawT=tasks.filter(t=>!String(t.cid).startsWith("DEMO"));render()});
}
function counts(){const c={};ST.forEach(s=>c[s]=clients.filter(x=>!x.archived&&x.status==s).length);return c}
function fmtC(n){n=Number(n)||0;return n>=1e7?"₹"+(n/1e7).toFixed(2)+" Cr":n>=1e5?"₹"+(n/1e5).toFixed(2)+" L":money(n)}
function home(){
  const L=clients.filter(x=>!x.archived),c=counts(),t=today(),pend=tasks.filter(x=>x.status=="Pending");
  const due=pend.filter(x=>x.date==t),od=pend.filter(x=>x.date<t),n=s=>c[s]||0;
  const pa=n("Application In Progress")+n("Application Submitted")+n("Documents Pending")+n("Documents Complete")+n("Verification In Progress")+n("Under Review");
  const ip=n("Application In Progress")+n("Verification In Progress")+n("Disbursement In Progress");
  const hr=new Date().getHours(),gr=hr<12?"Good Morning":hr<17?"Good Afternoon":"Good Evening";
  const open=L.filter(x=>!["Rejected","Closed","Disbursed"].includes(x.status)),pipe=open.reduce((s,x)=>s+Number(x.amount||0),0);
  const dstr=new Date().toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  const kp=[["👥","Total Clients",L.length,"#5b8fd6"],["✨","New Leads",n("New Lead"),"#2f80ed"],["📄","Pending Apps",pa,"#d4a017"],["✅","Approved",n("Approved"),"#27ae60"],["₹","Disbursed",n("Disbursed"),"#9b51e0"],["⏳","In Progress",ip,"#14b8a6"],["📅","Due Today",due.length,"#f2994a"],["⚠️","Overdue",od.length,"#eb5757"]];
  const qa=[["🔁","Cross Sell","cust","cuv='cross';cusel=null;"],["🧮","EMI Calc","calc",""],["📅","Follow-ups","fu",""],["🚗","Customers","cust","cuv='list';cusel=null;"]];
  const FN=[["Leads",["New Lead","Contacted"]],["Application",["Application In Progress","Application Submitted"]],["Documents",["Documents Pending","Documents Complete"]],["Verify & Review",["Verification In Progress","Under Review"]],["Approved",["Approved"]],["Disbursal",["Disbursement In Progress","Disbursed"]]].map(([a,b])=>[a,b.reduce((s,x)=>s+n(x),0)]);
  const fm=Math.max(1,...FN.map(x=>x[1]));
  const G=[["New Lead",n("New Lead"),"#2f80ed"],["In Progress",n("Application In Progress")+n("Application Submitted")+n("Contacted"),"#27ae60"],["Under Review",n("Under Review")+n("Verification In Progress"),"#f2c94c"],["Approved",n("Approved"),"#14b8a6"],["Disbursed",n("Disbursed"),"#9b51e0"],["Rejected",n("Rejected"),"#eb5757"]];
  G.push(["Others",Math.max(0,L.length-G.reduce((s,x)=>s+x[1],0)),"#a0aec0"]);
  let acc=0;const tot=Math.max(1,L.length),grad=G.map(([,v,k])=>{const s=acc/tot*100;acc+=v;return `${k} ${s}% ${acc/tot*100}%`}).join(",");
  const mo=[];for(let i=5;i>=0;i--){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);const k=d.toISOString().slice(0,7);mo.push([d.toLocaleString("en",{month:"short"}),L.filter(x=>(x.appDate||x.created||"").slice(0,7)==k).length])}
  const mx=Math.max(1,...mo.map(m=>m[1]));
  const mix=LT.map(l=>{const a=L.filter(x=>x.loanType==l);return[l,a.length,a.reduce((s,x)=>s+Number(x.amount||0),0)]}).filter(x=>x[1]);const mxm=Math.max(1,...mix.map(x=>x[2]));
  const act=clients.filter(x=>!x.archived).flatMap(x=>(x.history||[]).map(h=>({...h,name:x.name,id:x.id}))).sort((a,b)=>b.at.localeCompare(a.at)).slice(0,5);
  const ini=s=>String(s).split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();
  const focus=[...od.map(x=>({...x,late:1})),...due].slice(0,4);
  return `<div class="hm-hero"><div class="em-k">${gr.toUpperCase()} · ${(RL[(staff.find(x=>x.id==sess)||{}).role]||"").toUpperCase()}</div><div class="hm-date">${dstr}</div>

const rnd=(x,m)=>m=="up"?Math.ceil(x-1e-7):m=="down"?Math.floor(x+1e-7):Math.round(x);
const P2=v=>Math.round(Number(v||0)*100);
function addM(s,i){const[y,m,d]=s.split("-").map(Number);const t=new Date(Date.UTC(y,m-1+i,1));const dim=new Date(Date.UTC(t.getUTCFullYear(),t.getUTCMonth()+1,0)).getUTCDate();t.setUTCDate(Math.min(d,dim));return t.toISOString().slice(0,10)}
function emiOf(bal,r,n,md){return r==0?rnd(bal/n,md):rnd(bal*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1),md)}
const okD=s=>/^\d{4}-\d{2}-\d{2}$/.test(s||"")&&!isNaN(Date.parse(s));
function calcLoan(o){
  const e={},blank=v=>v===""||v==null,P=Number(o.P),rate=Number(o.rate),T=Number(o.tenure);
  if(blank(o.P)||!(P>0))e.P="Loan amount must be a positive number.";
  if(blank(o.rate)||!(rate>=0))e.rate="Interest rate must be 0 or more.";
  const n=o.unit=="y"?Math.round(T*12):Math.round(T);
  if(blank(o.tenure)||!(T>0))e.tenure="Tenure must be positive.";
  else if(Math.abs((o.unit=="y"?T*12:T)-n)>1e-9||n<1)e.tenure="Tenure must be a whole number of months.";
  else if(n>600)e.tenure="Maximum tenure is 50 years.";
  if(!okD(o.start))e.start="Enter a valid EMI start date.";
  ["fee","other","extra","partAmt"].forEach(k=>{if(!blank(o[k])&&!(Number(o[k])>=0))e[k]="Must be 0 or more."});
  if(!blank(o.partAmt)&&Number(o.partAmt)>0&&!okD(o.partDate))e.partDate="Enter a valid part-payment date.";
  if(!blank(o.rcRate)&&(!(Number(o.rcRate)>=0)||!okD(o.rcDate)))e.rcRate="Rate change needs a date and a rate of 0 or more.";
  const flat=o.method=="flat";
  if(flat&&(Number(o.extra)>0||Number(o.partAmt)>0||!blank(o.rcRate)))e.method="Extra payments, part-payments and rate changes are only supported for reducing balance.";
  if(Object.keys(e).length)return{err:e};
  const md=o.rounding||"nearest",fee=P2(o.fee),oth=P2(o.other),fin=!!o.financed;
  const Pp=P2(P)+(fin?fee+oth:0),rows=[];
  let emi;
  if(flat){
    const TI=rnd(Pp*rate/100*(n/12),md);emi=rnd((Pp+TI)/n,md);let cum=0;
    for(let i=1;i<=n;i++){const int=Math.round(TI*i/n)-Math.round(TI*(i-1)/n),pr=Math.round(Pp*i/n)-Math.round(Pp*(i-1)/n);const open=Pp-cum;cum+=pr;rows.push({i,due:addM(o.start,i-1),open,pay:int+pr,int,pr,ap:0,fee:0,close:Pp-cum})}
  }else{
    let bal=Pp,r=rate/1200,i=0,partDone=false,rcDone=false;const extra=P2(o.extra),part=P2(o.partAmt),rcR=blank(o.rcRate)?null:Number(o.rcRate)/1200;
    emi=emiOf(bal,r,n,md);const emi0=emi;
    while(bal>0&&i<n){i++;const due=addM(o.start,i-1),open=bal;
      if(rcR!==null&&!rcDone&&due>=o.rcDate){r=rcR;rcDone=true;emi=emiOf(bal,r,n-i+1,md)}
      const int=rnd(bal*r,md);let pay=emi;if(i==n||pay>=bal+int)pay=bal+int;
      const pr=pay-int;bal-=pr;let ap=0;
      if(extra&&bal>0){ap=Math.min(extra,bal);bal-=ap}
      if(part&&!partDone&&due>=o.partDate&&bal>0){const pp=Math.min(part,bal);ap+=pp;bal-=pp;partDone=true;if(o.partMode=="emi"&&bal>0&&i<n)emi=emiOf(bal,r,n-i,md)}
      rows.push({i,due,open,pay,int,pr,ap,fee:0,close:bal});
    }
    emi=emi0;
  }
  if(!fin&&rows.length)rows[0].fee=fee+oth;
  const sum=k=>rows.reduce((s,x)=>s+x[k],0),ti=sum("int"),prin=sum("pr")+sum("ap"),rep=sum("pay")+sum("ap"),sep=fin?0:fee+oth;
  return{rows,n,emi,t:{principal:P2(P),financedPrincipal:Pp,interest:ti,repayment:rep,fees:fee,other:oth,feesSeparate:sep,totalCost:rep+sep,ratio:P2(P)?ti/P2(P):0,payoff:rows[rows.length-1].due,principalRepaid:prin,finalBalance:rows[rows.length-1].close}};
}

async function saveClient(){
  const v=id=>$("#"+id).value.trim();errs={};
  const name=v("f_name"),ref=v("f_ref"),mob=v("f_mobile"),amt=Number(v("f_amt")),d=v("f_date");
  if(!name)errs.name="Client name is required.";
  if(!(amt>0))errs.amount="Enter a positive amount.";
  if(mob&&!/^[6-9]\d{9}$/.test(mob))errs.mobile="Enter a valid 10-digit mobile number.";
  if(!d||isNaN(new Date(d)))errs.date="Enter a valid date.";
  if(ref&&rawC.some(c=>c.ref==ref))errs.ref="This reference already exists.";
  
  const dup=rawC.find(c=>c.name.toLowerCase()==name.toLowerCase()&&(!mob||c.mobile==mob));
  if(dup&&!errs.name&&!window._dupOk){errs.name="Similar client exists. Tap Save again to confirm.";window._dupOk=true}else if(!dup)window._dupOk=false;
  if(Object.keys(errs).length){render();return}
  const id="C"+Date.now().toString(36).toUpperCase(),now=new Date().toISOString();
  const rec={name,ref,mobile:mob,village:v("f_village"),city:v("f_city"),assets:draft,loanType:$("#f_lt").value,amount:amt,appDate:d,source:$("#f_src").value,priority:$("#f_pri").value,status:"New Lead",notes:v("f_notes"),owner:me||"",created:now,history:[{from:"—",to:"New Lead",at:now,by:me||"",note:"Client created",next:""}]};
  try{await db.collection("clients").doc(id).set(rec);
    const fu=v("f_fu");if(fu)await db.collection("tasks").doc("T"+Date.now().toString(36)).set({cid:id,name,date:fu,type:"Call",status:"Pending",note:"Initial follow-up"});
    window._dupOk=false;logAudit("client.create",id,"");draft.forEach(a=>logAudit("asset.create",id,a.type));draft=[];FV={};toast="Saved "+id;sel=id;tab="clients"}catch(e){toast="Save failed: "+e.message}
  render()}

async function upStatus(id){
  const c=clients.find(x=>x.id==id),to=$("#u_st").value,note=$("#u_note").value.trim();
  if(!note){toast="A reason or note is required.";render();return}
  if(to==c.status){toast="Status unchanged.";render();return}
  const h=[...c.history,{from:c.status,to,at:new Date().toISOString(),by:me||"",note,next:$("#u_next").value.trim()}];
  try{await db.collection("clients").doc(id).update({status:to,history:h});
    const fu=$("#u_fu").value;if(fu)await db.collection("tasks").doc("T"+Date.now().toString(36)).set({cid:id,name:c.name,date:fu,type:"Call",status:"Pending",note:note});
    toast="Status updated."}catch(e){toast="Failed: "+e.message}render()}
async function addTask(id){
  const c=clients.find(x=>x.id==id),d=$("#t_date").value;if(!d){toast="Pick a date.";render();return}
  if(tasks.some(t=>t.cid==id&&t.date==d&&t.status=="Pending")){toast="A pending follow-up already exists for that date.";render();return}
  await db.collection("tasks").doc("T"+Date.now().toString(36)).set({cid:id,name:c.name,date:d,type:$("#t_type").value,status:"Pending",note:$("#t_note").value});toast="Follow-up added.";render()}
async function archive(id){if(arm!=id){arm=id;render();return}arm=null;await db.collection("clients").doc(id).update({archived:true});sel=null;render()}
async function setTask(id,s){if(s=="Rescheduled"){const d=$("#r_"+id).value;if(!d)return;resch=null;await db.collection("tasks").doc(id).update({date:d,status:"Pending"})}else await db.collection("tasks").doc(id).update({status:s})}
function fups(){
  const t=today(),P=tasks.filter(x=>x.status=="Pending").sort((a,b)=>a.date.localeCompare(b.date));
  const g=[["Overdue",P.filter(x=>x.date<t),"bd"],["Today",P.filter(x=>x.date==t),"wn"],["Upcoming",P.filter(x=>x.date>t),""],["Completed",tasks.filter(x=>x.status=="Completed").slice(0,10),"ok"]];
  return g.map(([n,L,k])=>`<h4 class="${k}">${n} (${L.length})</h4>${L.map(x=>`<div class="card"><b>${esc(x.name)}</b> <span class="mu">${x.type} · ${x.date}</span><div class="mu">${esc(x.note)}</div>${x.status=="Pending"?`<div class="grid"><button class="b" onclick="setTask('${x.id}','Completed')">Done</button><button class="b s" onclick="resch='${x.id}';render()">Reschedule</button></div>${resch==x.id?`<input id="r_${x.id}" type="date"><button class="b" onclick="setTask('${x.id}','Rescheduled')">Save new date</button>`:""}`:""}</div>`).join("")||'<p class="mu">Nothing here.</p>'}`).join("")}

async function fnCall(body){const {data,error}=await sb.functions.invoke("admin-users",{body});return error?{error:error.message}:data}
async function addStaff(){if(!isAdmin)return;const g=k=>($("#f_s_"+k)||{value:""}).value,name=g("name").trim(),mob=g("mob").trim(),pw=g("pw"),role=g("role")||"EMPLOYEE";

  else if(!okMob(mob))toast="Enter a valid 10-digit mobile number.";else if(staff.some(x=>x.mobile==mob))toast="This mobile number is already registered.";else if(pw.length<8)toast="Passcode must be at least 8 characters.";

async function toggleStaff(id){if(!isAdmin)return;const u=staff.find(x=>x.id==id);if(id==me){toast="You cannot deactivate your own account.";render();return}

async function setRole(id,role){if(!isAdmin)return;const u=staff.find(x=>x.id==id);
  if(u.role=="ADMIN"&&role!="ADMIN"&&staff.filter(x=>x.role=="ADMIN"&&x.active).length<2){toast="At least one active admin is required.";render();return}
  const {error}=await sb.from("profiles").update({role}).eq("id",id);if(error)toast=error.message;else{logAudit("user.role","",u.name+" → "+role);await loadStaff();if(id==me)enter({...u,role})}render()}
async function resetPw(id){if(!isAdmin)return;if(rpId!=id){rpId=id;render();return}const np=($("#f_s_np")||{value:""}).value;

function cuFiltered(){let L=cuVis();const q=CF.q.toLowerCase();

  <select id="c_sort" onchange="CF.sort=this.value;cuLive()"><option value="new" ${CF.sort=="new"?"selected":""}>Sort: Newest date</option><option value="pending" ${CF.sort=="pending"?"selected":""}>Sort: Pending priority</option></select>

async function cuUp(k,el){const f=el.files&&el.files[0];if(!f)return;if(!(/^image\//.test(f.type)||f.type=="application/pdf")){toast="Only PDF or image files are allowed.";render();return}

async function cuAddDealer(){const n=($("#f_cu_dealer")||{value:""}).value.trim();if(n.length<2){toast="Type the dealer name first.";render();return}
  if(dealerL.some(d=>d.name.toLowerCase()==n.toLowerCase())){toast="Dealer already exists.";render();return}
  await db.collection("dealers").doc("D"+Date.now().toString(36)).set({name:n,created:new Date().toISOString(),by:me||""});logAudit("dealer.create","",n);toast="Dealer added: "+n;render()}
async function cuAddShow(){const n=($("#f_cu_show")||{value:""}).value.trim(),d=($("#f_cu_dealer")||{value:""}).value.trim();if(n.length<2){toast="Type the showroom name first.";render();return}
  if(showL.some(s=>s.name.toLowerCase()==n.toLowerCase()&&(s.dealer||"").toLowerCase()==d.toLowerCase())){toast="Showroom already exists.";render();return}
  await db.collection("showrooms").doc("S"+Date.now().toString(36)).set({name:n,dealer:d,city:($("#f_cu_city")||{value:""}).value.trim(),address:($("#f_cu_addr")||{value:""}).value.trim(),created:new Date().toISOString(),by:me||""});logAudit("showroom.create","",n);toast="Showroom added: "+n;render()}
async function cuSave(){const g=k=>($("#f_cu_"+k)||{value:""}).value.trim();cuErr={};
  const name=g("name"),date=g("date"),dealer=g("dealer"),show=g("show"),city=g("city");
  if(!name)cuErr.name="Customer name is required.";if(!okD(date))cuErr.date="Enter a valid date.";
  if(dealer&&!dealerL.some(d=>d.name.toLowerCase()==dealer.toLowerCase()))cuErr.dealer="Pick an existing dealer or tap “Add as new dealer”.";
  if(show&&!showL.some(s=>s.name.toLowerCase()==show.toLowerCase()))cuErr.show="Pick an existing showroom or tap “Add as new showroom”.";
  const docs={};DK.forEach(([k])=>{const dt=g(k+"_dt");if(dt&&!okD(dt))cuErr[k]="Enter a valid date.";docs[k]={st:g(k+"_st")||"Pending",no:g(k+"_no"),dt,doc:cdoc[k]||null}});
  const rule=cuCfg.dup,dup=rule=="off"?null:rawCU.find(c=>c.id!=cuEdit&&c.name.toLowerCase()==name.toLowerCase()&&(rule=="name_dealer"?(c.dealer||"")==dealer:rule=="name_showroom"?(c.showroom||"")==show:(c.city||"").toLowerCase()==city.toLowerCase()));
  if(dup&&!cuErr.name&&!cuDupOk){cuErr.name="Possible duplicate: "+dup.cid+". Tap Save again to confirm.";cuDupOk=true}else if(!dup)cuDupOk=false;
  if(Object.keys(cuErr).length){render();return}
  const now=new Date().toISOString(),base={date,name,dealer,showroom:show,stage:g("stage")||STG()[0],query:g("query"),reason:g("reason"),city,address:g("addr"),...docs};
  try{if(!cuEdit){let cid=cuNextId;if(!cid||rawCU.some(c=>c.cid==cid))cid=genCid();const id="CU"+Date.now().toString(36).toUpperCase();
      await db.collection("customers").doc(id).set({...base,cid,owner:me||"",created:now,updated:now,fups:[],history:[{at:now,by:me||"",f:"Created",from:"—",to:base.stage,remark:base.reason}]});logAudit("customer.create",id,cid);cusel=id;toast="Saved "+cid}
    else{const o=rawCU.find(x=>x.id==cuEdit),h=[...o.history],ch=(f,a,b,r)=>{if(String(a||"")!=String(b||""))h.push({at:now,by:me||"",f,from:a||"—",to:b||"—",remark:r||""})};
      ch("Stage",o.stage,base.stage,base.reason);DK.forEach(([k,l])=>{ch(l+" status",o[k].st,docs[k].st);ch(l+" number",o[k].no,docs[k].no);ch(l+" date",o[k].dt,docs[k].dt);ch(l+" document",(o[k].doc||{}).name,(docs[k].doc||{}).name)});
      ["name","dealer","showroom","city","address","query","reason"].forEach(f=>ch("Detail: "+f,o[f],base[f]));
      await db.collection("customers").doc(cuEdit).update({...base,updated:now,history:h});logAudit("customer.update",cuEdit,o.cid);cusel=cuEdit;toast="Changes saved"}
    cuv="detail";cuEdit=null;FV={};cdoc={inv:null,ins:null,rto:null}}catch(e){toast="Save failed: "+e.message}render()}
function fuForm(id){return `<div class="card" style="margin:6px 0"><b>Add follow-up</b><input id="fd_${id}" type="date"><select id="fw_${id}">${staff.filter(u=>u.active).map(u=>`<option value="${u.id}" ${u.id==me?"selected":""}>${esc(u.name)}</option>`).join("")}</select><input id="fr_${id}" placeholder="Remarks"><button class="b" onclick="cuAddFU('${id}')">Save follow-up</button></div>`}
